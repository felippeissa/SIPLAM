<title>Mapa da Área Central</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --ink:#141a21; --ink-2:#43505d; --ink-3:#6f7d8a;
    --ground:#eef1f4; --grid:#dde3e9;
    --surface:#ffffff; --surface-2:#e9edf1;
    --line:#cfd7df; --line-strong:#aab6c2;
    --accent:#1f5c8b; --accent-soft:#e2edf6;
    --c:#1f6b4d; --c-soft:#e0efe8;
    --r:#33566f; --r-soft:#e6ecf1;
    --u:#8a5a12; --u-soft:#f6ecd9;
    --gap:#9b3324; --gap-soft:#f8e4e1;
    --q:#6a3b8f; --q-soft:#efe6f6;
    --edge:#a9b6c2;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ink:#e9eef3; --ink-2:#b6c2ce; --ink-3:#8593a1;
    --ground:#10151a; --grid:#1b232b;
    --surface:#1a2128; --surface-2:#222b34;
    --line:#2e3841; --line-strong:#42505c;
    --accent:#74b4e0; --accent-soft:#152e3d;
    --c:#6fc79f; --c-soft:#14302a;
    --r:#9fb6c8; --r-soft:#1e2830;
    --u:#dcae63; --u-soft:#312512;
    --gap:#e8897a; --gap-soft:#361c19;
    --q:#c39fe0; --q-soft:#291b36;
    --edge:#3c4854;
  }}
  :root[data-theme="dark"]{
    --ink:#e9eef3; --ink-2:#b6c2ce; --ink-3:#8593a1;
    --ground:#10151a; --grid:#1b232b;
    --surface:#1a2128; --surface-2:#222b34;
    --line:#2e3841; --line-strong:#42505c;
    --accent:#74b4e0; --accent-soft:#152e3d;
    --c:#6fc79f; --c-soft:#14302a;
    --r:#9fb6c8; --r-soft:#1e2830;
    --u:#dcae63; --u-soft:#312512;
    --gap:#e8897a; --gap-soft:#361c19;
    --q:#c39fe0; --q-soft:#291b36;
    --edge:#3c4854;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif; font-size:14px;
    overflow:hidden;
  }

  .bar{
    position:fixed; inset:0 0 auto 0; z-index:20;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:10px 18px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .bar h1{
    font-family:Archivo,sans-serif; font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em;
  }
  .bar .sub{font-size:12px; color:var(--ink-3); font-family:"JetBrains Mono",monospace;}
  .legend{display:flex; gap:12px; flex-wrap:wrap; margin-left:auto; align-items:center;}
  .lg{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2);}
  .sw{width:11px; height:11px; border-radius:3px; border:1px solid var(--line-strong);}
  .tools{display:flex; gap:6px;}
  .tools button{
    font:inherit; font-size:12px; padding:4px 11px; cursor:pointer;
    background:var(--surface); color:var(--ink-2); border:1px solid var(--line-strong); border-radius:4px;
  }
  .tools button:hover{background:var(--surface-2); color:var(--ink);}
  .tools button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  #stage{
    position:fixed; inset:0; top:0; cursor:grab;
    background-image:radial-gradient(var(--grid) 1px, transparent 1px);
    background-size:22px 22px;
  }
  #stage.panning{cursor:grabbing}
  #world{position:absolute; top:0; left:0; transform-origin:0 0;}
  #edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}

  .node{
    position:absolute; background:var(--surface); border:1px solid var(--line);
    border-radius:6px; padding:9px 12px; cursor:grab; user-select:none;
    box-shadow:0 1px 2px rgba(16,24,32,.06);
  }
  .node:active{cursor:grabbing}
  .node.dragging{box-shadow:0 8px 20px rgba(16,24,32,.18); z-index:5;}
  .node .k{
    font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.1em;
    text-transform:uppercase; margin-bottom:3px;
  }
  .node .t{font-weight:600; line-height:1.3; font-size:13.5px;}
  .node .s{font-size:12px; color:var(--ink-3); margin-top:3px; line-height:1.4;}
  .node .s code{font-family:"JetBrains Mono",monospace; font-size:11px;}

  .n-root{width:250px; background:var(--accent); border-color:var(--accent); color:#fff; padding:13px 15px;}
  .n-root .k{color:rgba(255,255,255,.72)}
  .n-root .t{font-family:Archivo,sans-serif; font-size:17px;}
  .n-root .s{color:rgba(255,255,255,.8)}

  .n-tela{width:270px; border-left:3px solid var(--accent); background:var(--surface);}
  .n-tela .k{color:var(--accent)}
  .n-tela .s{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3);}

  .n-acao{width:236px; padding:7px 11px;}
  .n-acao .t{font-size:13px; font-weight:600;}
  .n-acao.op-C{background:var(--c-soft); border-color:transparent} .n-acao.op-C .k{color:var(--c)}
  .n-acao.op-R{background:var(--r-soft); border-color:transparent} .n-acao.op-R .k{color:var(--r)}
  .n-acao.op-U{background:var(--u-soft); border-color:transparent} .n-acao.op-U .k{color:var(--u)}
  .n-acao.op-D{background:var(--gap-soft); border-color:transparent; border-style:dashed; border-width:1px; border-color:var(--gap);}
  .n-acao.op-D .k{color:var(--gap)}
  .n-acao.op-D .t{color:var(--gap)}

  .n-pergunta{
    width:290px; background:var(--q-soft); border-color:transparent;
    border-left:3px solid var(--q);
  }
  .n-pergunta .k{color:var(--q)}
  .n-pergunta .t{font-weight:400; font-size:13px; line-height:1.42;}
  .n-pergunta .t b{font-weight:600;}

  .hint{
    position:fixed; left:18px; bottom:14px; z-index:20; font-size:11.5px; color:var(--ink-3);
    background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:5px 10px;
    font-family:"JetBrains Mono",monospace;
  }
</style>

<div class="bar">
  <div>
    <h1>Visão Área Central — mapa de telas e ações</h1>
    <div class="sub">PPA 2028–2031 · 9 telas · 24 ações · 18 perguntas para os stakeholders</div>
  </div>
  <div class="legend">
    <span class="lg"><span class="sw" style="background:var(--c-soft);border-color:var(--c)"></span>Criar</span>
    <span class="lg"><span class="sw" style="background:var(--r-soft);border-color:var(--r)"></span>Consultar</span>
    <span class="lg"><span class="sw" style="background:var(--u-soft);border-color:var(--u)"></span>Alterar</span>
    <span class="lg"><span class="sw" style="background:var(--gap-soft);border-color:var(--gap)"></span>Não existe</span>
    <span class="lg"><span class="sw" style="background:var(--q-soft);border-color:var(--q)"></span>Pergunta</span>
  </div>
  <div class="tools">
    <button id="zin" title="Aproximar">+</button>
    <button id="zout" title="Afastar">−</button>
    <button id="fit">Enquadrar</button>
    <button id="reset">Reorganizar</button>
  </div>
</div>

<div id="stage">
  <div id="world">
    <svg id="edges"></svg>
  </div>
</div>
<div class="hint">arraste os nós para reorganizar · arraste o fundo para navegar · as posições ficam salvas</div>

<script>
const DATA = [
  { id:"root", tipo:"root", k:"Persona", t:"Visão Área Central", s:"Maria Fonseca · analista da área central" },

  { id:"t1", tipo:"tela", pai:"root", k:"Tela", t:"Visão Geral", s:"/central",
    filhos:[
      { id:"t1a1", op:"R", t:"Consultar consolidação dos Programas" },
      { id:"t1a2", op:"R", t:"Expandir participação por órgão" },
      { id:"t1a3", op:"R", t:"Ver cobertura de causas do Programa" },
      { id:"t1a4", op:"R", t:"Filtrar: aguardando análise · devolvidas" },
    ],
    perguntas:[
      { id:"t1q1", t:"A Visão Geral é só leitura, ou o analista deveria <b>agir daqui</b> — cobrar órgão, atribuir analista, priorizar fila?" },
    ]},

  { id:"t2", tipo:"tela", pai:"root", k:"Tela", t:"Entregas do PPA", s:"/central/entregas",
    filhos:[
      { id:"t2a1", op:"R", t:"Consultar Entregas de todos os órgãos" },
      { id:"t2a2", op:"R", t:"Filtrar por órgão, programa e situação" },
    ],
    perguntas:[
      { id:"t2q1", t:"O analista pode <b>apontar direto na Entrega</b>, sem abrir a Iniciativa? Hoje o apontamento só nasce na ficha da Iniciativa." },
    ]},

  { id:"t3", tipo:"tela", pai:"root", k:"Tela", t:"Órgãos participantes", s:"/central/orgaos",
    filhos:[
      { id:"t3a1", op:"R", t:"Consultar órgãos e situação do fluxo" },
      { id:"t3a2", op:"R", t:"Expandir órgão → programa → iniciativa" },
    ],
    perguntas:[
      { id:"t3q1", t:"Falta <b>responsável e contato</b> do órgão. Quem o analista aciona quando um órgão não envia nada?" },
      { id:"t3q2", t:"Cobrar/notificar o órgão é função do sistema, ou acontece fora dele (e-mail, ofício, reunião)?" },
    ]},

  { id:"t4", tipo:"tela", pai:"root", k:"Tela · Análise", t:"Por Causas", s:"/central/analises/causas",
    filhos:[
      { id:"t4a1", op:"R", t:"Consultar cobertura direta e indireta por causa" },
    ],
    perguntas:[
      { id:"t4q1", t:"Uma causa <b>sem cobertura</b> gera algum ato formal — devolução, pauta de reunião, registro de justificativa?" },
    ]},

  { id:"t5", tipo:"tela", pai:"root", k:"Tela · Análise", t:"Financeira", s:"/central/analises/financeira",
    filhos:[
      { id:"t5a1", op:"R", t:"Consultar quadro plurianual 2028–2031" },
      { id:"t5a2", op:"R", t:"Trocar dimensão de agrupamento" },
      { id:"t5a3", op:"R", t:"Filtrar por ano, eixo, objetivo, programa, órgão e fonte" },
    ],
    perguntas:[
      { id:"t5q1", t:"<b>Não existe nenhuma exportação</b> em toda a Área Central. Exportar CSV/Excel é requisito, ou o consumo é só em tela?" },
    ]},

  { id:"t6", tipo:"tela", pai:"root", k:"Tela · Análise", t:"Projetos GOMAP", s:"/central/analises/projetos",
    filhos:[
      { id:"t6a1", op:"R", t:"Consultar Projetos, fase e execução" },
      { id:"t6a2", op:"R", t:"Ver descompasso GOMAP × PPA" },
    ],
    perguntas:[
      { id:"t6q1", t:"O descompasso é <b>erro a corrigir</b> ou informação aceitável? Existe limiar a partir do qual vira pendência?" },
    ]},

  { id:"t7", tipo:"tela", pai:"root", k:"Tela · Análise", t:"IPOFs", s:"/central/analises/ipofs",
    filhos:[
      { id:"t7a1", op:"R", t:"Consultar IPOFs e suas parcelas" },
      { id:"t7a2", op:"R", t:"Ver execução SIAFIC (empenhado, liquidado, pago)" },
    ],
    perguntas:[
      { id:"t7q1", t:"IPOF <b>sem Ação vinculada a nenhuma Entrega</b> é um problema a listar para o analista, ou situação normal?" },
    ]},

  { id:"t8", tipo:"tela", pai:"root", k:"Tela · CRUD", t:"Administração de Programas", s:"/central/programas",
    filhos:[
      { id:"t8a1", op:"C", t:"Novo Programa" },
      { id:"t8a2", op:"R", t:"Consultar lista + filtrar por eixo e objetivo" },
      { id:"t8a3", op:"U", t:"Editar Programa" },
      { id:"t8a4", op:"U", t:"Definir aptidão e disponibilização", s:"transição de estado, não é edição de conteúdo" },
      { id:"t8a5", op:"D", t:"Excluir Programa", s:"não existe no sistema" },
    ],
    perguntas:[
      { id:"t8q1", t:"<b>Por que não existe excluir Programa?</b> É impedimento legal do PPA (peça aprovada em lei) ou apenas não foi construído?" },
      { id:"t8q2", t:"Programa criado por engano, antes de qualquer contribuição: qual o caminho — excluir de fato, arquivar, ou ocultar?" },
      { id:"t8q3", t:"“Encerrado para novas contribuições” faz o papel da exclusão? O que acontece com as Iniciativas já vinculadas a ele?" },
      { id:"t8q4", t:"Quem pode <b>disponibilizar</b> um Programa para os órgãos? É o mesmo perfil que edita o diagnóstico?" },
      { id:"t8q5", t:"Editar um Programa já disponível é permitido? Remover uma causa deixa <b>Iniciativas órfãs</b> que a referenciam." },
      { id:"t8q6", t:"Precisa de <b>histórico de alterações</b> do Programa — quem mudou o quê e quando?" },
    ]},

  { id:"t9", tipo:"tela", pai:"root", k:"Tela · Fluxo", t:"Iniciativa em análise", s:"/central/iniciativa/$id",
    filhos:[
      { id:"t9a1", op:"R", t:"Consultar ficha, entregas e pendências" },
      { id:"t9a2", op:"U", t:"Iniciar análise" },
      { id:"t9a3", op:"C", t:"Registrar apontamento em um campo" },
      { id:"t9a4", op:"U", t:"Devolver para ajuste" },
      { id:"t9a5", op:"U", t:"Validar Iniciativa" },
      { id:"t9a6", op:"D", t:"Resolver apontamento", s:"existe no modelo de dados, sem tela" },
      { id:"t9a7", op:"D", t:"Editar ou excluir apontamento", s:"não existe" },
    ],
    perguntas:[
      { id:"t9q1", t:"Quem <b>resolve</b> um apontamento: o órgão ao corrigir, ou o analista ao conferir? Hoje ninguém consegue." },
      { id:"t9q2", t:"Iniciativa validada pode ser <b>reaberta</b>? Por quem, e com qual registro?" },
      { id:"t9q3", t:"A atribuição do analista é automática ao iniciar a análise, ou existe <b>distribuição de fila</b> por alguém?" },
      { id:"t9q4", t:"Devolver <b>sem nenhum apontamento</b> é permitido? Hoje só há uma recomendação, não um bloqueio." },
    ]},

  { id:"g", tipo:"tela", pai:"root", k:"Transversal", t:"Questões de sistema", s:"atravessam todas as telas",
    filhos:[],
    perguntas:[
      { id:"gq1", t:"Existem <b>perfis distintos</b> dentro da Área Central — quem só consulta, quem analisa, quem administra Programas?" },
      { id:"gq2", t:"A consolidação da Área Central precisa virar <b>documento</b>? O gerador de PDF só existe na visão setorial." },
      { id:"gq3", t:"Há <b>trilha de auditoria</b> além do histórico da Iniciativa — quem viu, exportou ou alterou o quê?" },
    ]},
];

const OPK = { C:"Criar", R:"Consultar", U:"Alterar", D:"Não existe" };

/* ---------- montagem dos nós ---------- */
const world = document.getElementById("world");
const svg = document.getElementById("edges");
const nodes = new Map();
const edges = [];

function el(cls, html){ const d = document.createElement("div"); d.className = cls; d.innerHTML = html; world.appendChild(d); return d; }
function corpo(k, t, s){ return `<div class="k">${k}</div><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ""}`; }

for (const n of DATA){
  if (n.tipo === "root"){
    nodes.set(n.id, { id:n.id, el: el("node n-root", corpo(n.k, n.t, n.s)), col:0 });
    continue;
  }
  nodes.set(n.id, { id:n.id, el: el("node n-tela", corpo(n.k, n.t, `<code>${n.s}</code>`)), col:1 });
  edges.push([n.pai, n.id]);

  for (const a of n.filhos){
    nodes.set(a.id, { id:a.id, el: el(`node n-acao op-${a.op}`, corpo(OPK[a.op], a.t, a.s)), col:2 });
    edges.push([n.id, a.id]);
  }
  for (const q of n.perguntas){
    nodes.set(q.id, { id:q.id, el: el("node n-pergunta", corpo("Pergunta", q.t)), col:3 });
    edges.push([n.id, q.id]);
  }
}

/* ---------- layout ---------- */
const COLX = [40, 360, 700, 1010];
const GAP_Y = 12, GAP_BLOCO = 46;

function layout(){
  let y = 120;
  const raiz = nodes.get("root");
  for (const n of DATA){
    if (n.tipo === "root") continue;
    const inicio = y;
    let ya = y, yq = y;
    for (const a of n.filhos){
      const nd = nodes.get(a.id);
      nd.x = COLX[2]; nd.y = ya;
      ya += nd.el.offsetHeight + GAP_Y;
    }
    for (const q of n.perguntas){
      const nd = nodes.get(q.id);
      nd.x = COLX[3]; nd.y = yq;
      yq += nd.el.offsetHeight + GAP_Y;
    }
    const fim = Math.max(ya, yq, inicio + nodes.get(n.id).el.offsetHeight + GAP_Y);
    const tela = nodes.get(n.id);
    tela.x = COLX[1];
    tela.y = inicio + (fim - GAP_Y - inicio - tela.el.offsetHeight) / 2;
    y = fim + GAP_BLOCO;
  }
  raiz.x = COLX[0];
  raiz.y = 120 + (y - GAP_BLOCO - 120 - raiz.el.offsetHeight) / 2;
  aplicar();
}

function aplicar(){
  for (const n of nodes.values()){
    n.el.style.transform = `translate(${n.x}px, ${n.y}px)`;
  }
  desenhar();
}

function desenhar(){
  let d = "";
  let maxX = 0, maxY = 0;
  for (const [a, b] of edges){
    const A = nodes.get(a), B = nodes.get(b);
    const x1 = A.x + A.el.offsetWidth, y1 = A.y + A.el.offsetHeight / 2;
    const x2 = B.x, y2 = B.y + B.el.offsetHeight / 2;
    const dx = Math.max(28, (x2 - x1) / 2);
    d += `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2} `;
    maxX = Math.max(maxX, x1, x2 + B.el.offsetWidth);
    maxY = Math.max(maxY, y1, y2 + B.el.offsetHeight);
  }
  svg.setAttribute("width", maxX + 80);
  svg.setAttribute("height", maxY + 80);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="var(--edge)" stroke-width="1.25"/>`;
}

/* ---------- persistência ---------- */
const KEY = "mapa-central-pos-v1";
function salvar(){
  try{
    const o = {};
    for (const n of nodes.values()) o[n.id] = [Math.round(n.x), Math.round(n.y)];
    localStorage.setItem(KEY, JSON.stringify({ pos:o, view:[tx, ty, esc] }));
  }catch{}
}
function carregar(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const { pos, view } = JSON.parse(raw);
    for (const n of nodes.values()) if (pos[n.id]) { n.x = pos[n.id][0]; n.y = pos[n.id][1]; }
    if (view) { tx = view[0]; ty = view[1]; esc = view[2]; }
    return true;
  }catch{ return false; }
}

/* ---------- navegação e arraste ---------- */
let tx = 0, ty = 66, esc = 1;
const stage = document.getElementById("stage");
function camera(){ world.style.transform = `translate(${tx}px, ${ty}px) scale(${esc})`; }

let alvo = null, ox = 0, oy = 0, panx = 0, pany = 0, pan = false;

world.addEventListener("pointerdown", (e) => {
  const nd = e.target.closest(".node");
  if (!nd) return;
  const item = [...nodes.values()].find((n) => n.el === nd);
  if (!item) return;
  alvo = item; ox = e.clientX / esc - item.x; oy = e.clientY / esc - item.y;
  nd.classList.add("dragging"); nd.setPointerCapture(e.pointerId);
  e.stopPropagation();
});
world.addEventListener("pointermove", (e) => {
  if (!alvo) return;
  alvo.x = e.clientX / esc - ox; alvo.y = e.clientY / esc - oy;
  alvo.el.style.transform = `translate(${alvo.x}px, ${alvo.y}px)`;
  desenhar();
});
world.addEventListener("pointerup", () => {
  if (!alvo) return;
  alvo.el.classList.remove("dragging"); alvo = null; salvar();
});

stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".node")) return;
  pan = true; panx = e.clientX - tx; pany = e.clientY - ty;
  stage.classList.add("panning"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => {
  if (!pan) return;
  tx = e.clientX - panx; ty = e.clientY - pany; camera();
});
stage.addEventListener("pointerup", () => { if (pan){ pan = false; stage.classList.remove("panning"); salvar(); } });

function zoom(f){ esc = Math.min(2, Math.max(0.3, esc * f)); camera(); salvar(); }
document.getElementById("zin").onclick = () => zoom(1.18);
document.getElementById("zout").onclick = () => zoom(1/1.18);
document.getElementById("fit").onclick = () => {
  const w = svg.width.baseVal.value, h = svg.height.baseVal.value;
  esc = Math.min((innerWidth - 60) / w, (innerHeight - 140) / h, 1);
  tx = 30; ty = 80; camera(); salvar();
};
document.getElementById("reset").onclick = () => {
  localStorage.removeItem(KEY);
  tx = 0; ty = 66; esc = 1; camera(); layout();
};
stage.addEventListener("wheel", (e) => { if (e.ctrlKey){ e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 1/1.1); } }, { passive:false });

/* ---------- início ---------- */
layout();
if (carregar()) aplicar();
camera();
</script>
