<title>Mapa do Sistema PPA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --ink:#141a21; --ink-2:#43505d; --ink-3:#6f7d8a;
    --ground:#eef1f4; --grid:#dde3e9;
    --surface:#ffffff; --surface-2:#e9edf1;
    --line:#cfd7df; --line-strong:#aab6c2;
    --accent:#1f5c8b; --accent-soft:#e2edf6;
    --setorial:#1f5c8b; --central:#7a4a1c; --transv:#3f5b52;
    --c:#1f6b4d; --c-soft:#e0efe8;
    --r:#33566f; --r-soft:#e6ecf1;
    --u:#8a5a12; --u-soft:#f6ecd9;
    --x:#8a2f3f; --x-soft:#f6e3e7;
    --gap:#9b3324; --gap-soft:#f8e4e1;
    --bug:#a8390d; --bug-soft:#fae3d6;
    --q:#6a3b8f; --q-soft:#efe6f6;
    --edge:#a9b6c2;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ink:#e9eef3; --ink-2:#b6c2ce; --ink-3:#8593a1;
    --ground:#10151a; --grid:#1b232b;
    --surface:#1a2128; --surface-2:#222b34;
    --line:#2e3841; --line-strong:#42505c;
    --accent:#74b4e0; --accent-soft:#152e3d;
    --setorial:#74b4e0; --central:#d8a066; --transv:#8fc0ae;
    --c:#6fc79f; --c-soft:#14302a;
    --r:#9fb6c8; --r-soft:#1e2830;
    --u:#dcae63; --u-soft:#312512;
    --x:#e08a9c; --x-soft:#331b21;
    --gap:#e8897a; --gap-soft:#361c19;
    --bug:#f0a17c; --bug-soft:#3a2116;
    --q:#c39fe0; --q-soft:#291b36;
    --edge:#3c4854;
  }}
  :root[data-theme="dark"]{
    --ink:#e9eef3; --ink-2:#b6c2ce; --ink-3:#8593a1;
    --ground:#10151a; --grid:#1b232b;
    --surface:#1a2128; --surface-2:#222b34;
    --line:#2e3841; --line-strong:#42505c;
    --accent:#74b4e0; --accent-soft:#152e3d;
    --setorial:#74b4e0; --central:#d8a066; --transv:#8fc0ae;
    --c:#6fc79f; --c-soft:#14302a;
    --r:#9fb6c8; --r-soft:#1e2830;
    --u:#dcae63; --u-soft:#312512;
    --x:#e08a9c; --x-soft:#331b21;
    --gap:#e8897a; --gap-soft:#361c19;
    --bug:#f0a17c; --bug-soft:#3a2116;
    --q:#c39fe0; --q-soft:#291b36;
    --edge:#3c4854;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif; font-size:14px; overflow:hidden;
  }

  .bar{
    position:fixed; inset:0 0 auto 0; z-index:20;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:9px 18px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .bar h1{font-family:Archivo,sans-serif; font-size:16px; font-weight:700; margin:0; letter-spacing:-.01em;}
  .bar .sub{font-size:11.5px; color:var(--ink-3); font-family:"JetBrains Mono",monospace; margin-top:1px;}
  .legend{display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; align-items:center;}
  .lg{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2); white-space:nowrap;}
  .sw{width:11px; height:11px; border-radius:3px; border:1px solid var(--line-strong);}
  .tools{display:flex; gap:6px;}
  .tools button{
    font:inherit; font-size:12px; padding:4px 10px; cursor:pointer;
    background:var(--surface); color:var(--ink-2); border:1px solid var(--line-strong); border-radius:4px;
  }
  .tools button:hover{background:var(--surface-2); color:var(--ink);}
  .tools button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tools button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  #stage{
    position:fixed; inset:0; cursor:grab;
    background-image:radial-gradient(var(--grid) 1px, transparent 1px); background-size:22px 22px;
  }
  #stage.panning{cursor:grabbing}
  #world{position:absolute; top:0; left:0; transform-origin:0 0;}
  #edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}

  .node{
    position:absolute; background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:9px 12px; cursor:grab; user-select:none; box-shadow:0 1px 2px rgba(16,24,32,.06);
  }
  .node:active{cursor:grabbing}
  .node.dragging{box-shadow:0 8px 20px rgba(16,24,32,.18); z-index:5;}
  .node.oculto{display:none}
  .node .k{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px;}
  .node .t{font-weight:600; line-height:1.3; font-size:13.5px;}
  .node .s{font-size:12px; color:var(--ink-3); margin-top:3px; line-height:1.4;}
  .node .s code{font-family:"JetBrains Mono",monospace; font-size:11px;}

  .n-root{width:236px; background:var(--accent); border-color:var(--accent); color:#fff; padding:13px 15px;}
  .n-root .k{color:rgba(255,255,255,.72)} .n-root .s{color:rgba(255,255,255,.8)}
  .n-root .t{font-family:Archivo,sans-serif; font-size:17px;}

  .n-grupo{width:206px; padding:11px 13px; border-width:2px;}
  .n-grupo .t{font-family:Archivo,sans-serif; font-size:15px;}
  .n-grupo.g-setorial{border-color:var(--setorial)} .n-grupo.g-setorial .k{color:var(--setorial)}
  .n-grupo.g-central{border-color:var(--central)} .n-grupo.g-central .k{color:var(--central)}
  .n-grupo.g-transv{border-color:var(--transv)} .n-grupo.g-transv .k{color:var(--transv)}

  .n-tela{width:252px; border-left:3px solid var(--line-strong);}
  .n-tela .s{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3);}
  .n-tela.g-setorial{border-left-color:var(--setorial)} .n-tela.g-setorial .k{color:var(--setorial)}
  .n-tela.g-central{border-left-color:var(--central)} .n-tela.g-central .k{color:var(--central)}
  .n-tela.g-transv{border-left-color:var(--transv)} .n-tela.g-transv .k{color:var(--transv)}

  .n-acao{width:250px; padding:7px 11px; border-color:transparent;}
  .n-acao .t{font-size:12.5px;}
  .n-acao.op-C{background:var(--c-soft)} .n-acao.op-C .k{color:var(--c)}
  .n-acao.op-R{background:var(--r-soft)} .n-acao.op-R .k{color:var(--r)}
  .n-acao.op-U{background:var(--u-soft)} .n-acao.op-U .k{color:var(--u)}
  .n-acao.op-X{background:var(--x-soft)} .n-acao.op-X .k{color:var(--x)}
  .n-acao.op-N{background:var(--gap-soft); border:1px dashed var(--gap);}
  .n-acao.op-N .k{color:var(--gap)} .n-acao.op-N .t{color:var(--gap)}

  .n-problema{
    width:296px; background:var(--bug-soft); border-color:transparent; border-left:3px solid var(--bug);
  }
  .n-problema .k{color:var(--bug)}
  .n-problema .t{font-weight:400; font-size:12.5px; line-height:1.42;}
  .n-problema .t b{font-weight:600;}

  .n-pergunta{width:296px; background:var(--q-soft); border-color:transparent; border-left:3px solid var(--q);}
  .n-pergunta .k{color:var(--q)}
  .n-pergunta .t{font-weight:400; font-size:12.5px; line-height:1.42;}
  .n-pergunta .t b{font-weight:600;}

  .hint{
    position:fixed; left:18px; bottom:14px; z-index:20; font-size:11.5px; color:var(--ink-3);
    background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:5px 10px;
    font-family:"JetBrains Mono",monospace;
  }
</style>

<div class="bar">
  <div>
    <h1>Mapa do sistema PPA 2028–2031</h1>
    <div class="sub" id="contagem">carregando…</div>
  </div>
  <div class="legend">
    <span class="lg"><span class="sw" style="background:var(--c-soft);border-color:var(--c)"></span>Criar</span>
    <span class="lg"><span class="sw" style="background:var(--r-soft);border-color:var(--r)"></span>Consultar</span>
    <span class="lg"><span class="sw" style="background:var(--u-soft);border-color:var(--u)"></span>Alterar</span>
    <span class="lg"><span class="sw" style="background:var(--x-soft);border-color:var(--x)"></span>Excluir</span>
    <span class="lg"><span class="sw" style="background:var(--gap-soft);border-color:var(--gap)"></span>Não existe</span>
    <span class="lg"><span class="sw" style="background:var(--bug-soft);border-color:var(--bug)"></span>Problema</span>
    <span class="lg"><span class="sw" style="background:var(--q-soft);border-color:var(--q)"></span>Pergunta</span>
  </div>
  <div class="tools">
    <button id="soPend" aria-pressed="false" title="Mostrar apenas lacunas, problemas e perguntas">Só pendências</button>
    <button id="zin" title="Aproximar">+</button>
    <button id="zout" title="Afastar">−</button>
    <button id="fit">Enquadrar</button>
    <button id="reset">Reorganizar</button>
  </div>
</div>

<div id="stage"><div id="world"><svg id="edges"></svg></div></div>
<div class="hint">arraste os nós · arraste o fundo para navegar · ctrl+scroll amplia · posições salvas</div>

const OPK = { C:"Criar", R:"Consultar", U:"Alterar", X:"Excluir", N:"Não existe" };

const world = document.getElementById("world");
const svg = document.getElementById("edges");
const nodes = new Map();
const edges = [];
let nTelas = 0, nAcoes = 0, nFaltas = 0, nProb = 0, nPerg = 0;

function el(cls, html){ const d = document.createElement("div"); d.className = cls; d.innerHTML = html; world.appendChild(d); return d; }
function corpo(k, t, s){ return `<div class="k">${k}</div><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ""}`; }

nodes.set("root", { id:"root", el: el("node n-root", corpo("Sistema", "PPA 2028–2031", "Estado de Goiás · protótipo SIPLAM")), tipo:"root" });

for (const g of GRUPOS){
  nodes.set(g.id, { id:g.id, el: el(`node n-grupo ${g.cls}`, corpo(g.k, g.t, g.s)), tipo:"grupo" });
  edges.push(["root", g.id]);

  for (const tela of g.telas){
    nTelas++;
    nodes.set(tela.id, { id:tela.id, el: el(`node n-tela ${g.cls}`, corpo(tela.k, tela.t, `<code>${tela.s}</code>`)), tipo:"tela" });
    edges.push([g.id, tela.id]);

    tela.acoes.forEach((a, i) => {
      const id = `${tela.id}a${i}`;
      a.op === "N" ? nFaltas++ : nAcoes++;
      nodes.set(id, { id, el: el(`node n-acao op-${a.op}`, corpo(OPK[a.op], a.t, a.s)), tipo: a.op === "N" ? "pend" : "acao" });
      edges.push([tela.id, id]);
    });
    (tela.problemas ?? []).forEach((p, i) => {
      const id = `${tela.id}p${i}`; nProb++;
      nodes.set(id, { id, el: el("node n-problema", corpo("Problema", p.t)), tipo:"pend" });
      edges.push([tela.id, id]);
    });
    (tela.perguntas ?? []).forEach((q, i) => {
      const id = `${tela.id}q${i}`; nPerg++;
      nodes.set(id, { id, el: el("node n-pergunta", corpo("Pergunta", q.t)), tipo:"pend" });
      edges.push([tela.id, id]);
    });
  }
}
document.getElementById("contagem").textContent =
  `${nTelas} telas · ${nAcoes} ações · ${nFaltas} lacunas · ${nProb} problemas · ${nPerg} perguntas em aberto`;

const COLX = [40, 330, 610, 930, 1260];
const GAP_Y = 10, GAP_TELA = 40, GAP_GRUPO = 90;
let soPendencias = false;

function visivel(n){
  if (!soPendencias) return true;
  return n.tipo !== "acao";
}

function layout(){
  let y = 110;
  for (const g of GRUPOS){
    const inicioGrupo = y;
    for (const tela of g.telas){
      const inicio = y;
      let ya = y, yd = y;
      tela.acoes.forEach((a, i) => {
        const nd = nodes.get(`${tela.id}a${i}`);
        if (a.op === "N"){ nd.x = COLX[4]; nd.y = yd; yd += nd.el.offsetHeight + GAP_Y; }
        else if (visivel(nd)){ nd.x = COLX[3]; nd.y = ya; ya += nd.el.offsetHeight + GAP_Y; }
        else { nd.x = COLX[3]; nd.y = ya; }
      });
      (tela.problemas ?? []).forEach((p, i) => {
        const nd = nodes.get(`${tela.id}p${i}`);
        nd.x = COLX[4]; nd.y = yd; yd += nd.el.offsetHeight + GAP_Y;
      });
      (tela.perguntas ?? []).forEach((q, i) => {
        const nd = nodes.get(`${tela.id}q${i}`);
        nd.x = COLX[4]; nd.y = yd; yd += nd.el.offsetHeight + GAP_Y;
      });
      const t = nodes.get(tela.id);
      const fim = Math.max(ya, yd, inicio + t.el.offsetHeight + GAP_Y);
      t.x = COLX[2];
      t.y = inicio + (fim - GAP_Y - inicio - t.el.offsetHeight) / 2;
      y = fim + GAP_TELA;
    }
    const gn = nodes.get(g.id);
    gn.x = COLX[1];
    gn.y = inicioGrupo + (y - GAP_TELA - inicioGrupo - gn.el.offsetHeight) / 2;
    y += GAP_GRUPO - GAP_TELA;
  }
  const raiz = nodes.get("root");
  raiz.x = COLX[0];
  raiz.y = 110 + (y - GAP_GRUPO - 110 - raiz.el.offsetHeight) / 2;
  aplicar();
}

function aplicar(){
  for (const n of nodes.values()){
    n.el.classList.toggle("oculto", !visivel(n));
    n.el.style.transform = `translate(${n.x}px, ${n.y}px)`;
  }
  desenhar();
}

function desenhar(){
  let d = "", maxX = 0, maxY = 0;
  for (const [a, b] of edges){
    const A = nodes.get(a), B = nodes.get(b);
    if (!visivel(A) || !visivel(B)) continue;
    const x1 = A.x + A.el.offsetWidth, y1 = A.y + A.el.offsetHeight / 2;
    const x2 = B.x, y2 = B.y + B.el.offsetHeight / 2;
    const dx = Math.max(24, (x2 - x1) / 2);
    d += `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2} `;
    maxX = Math.max(maxX, x2 + B.el.offsetWidth); maxY = Math.max(maxY, y2 + B.el.offsetHeight);
  }
  svg.setAttribute("width", maxX + 80);
  svg.setAttribute("height", maxY + 80);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="var(--edge)" stroke-width="1.25"/>`;
}

const KEY = "mapa-ppa-sistema-v2";
function salvar(){
  try{
    const o = {};
    for (const n of nodes.values()) o[n.id] = [Math.round(n.x), Math.round(n.y)];
    localStorage.setItem(KEY, JSON.stringify({ pos:o, view:[tx, ty, esc] }));
  }catch{}
}
function carregar(){
  try{
    const raw = localStorage.getItem(KEY); if (!raw) return false;
    const { pos, view } = JSON.parse(raw);
    for (const n of nodes.values()) if (pos && pos[n.id]) { n.x = pos[n.id][0]; n.y = pos[n.id][1]; }
    if (view) { tx = view[0]; ty = view[1]; esc = view[2]; }
    return true;
  }catch{ return false; }
}

let tx = 0, ty = 60, esc = 1;
const stage = document.getElementById("stage");
function camera(){ world.style.transform = `translate(${tx}px, ${ty}px) scale(${esc})`; }

let alvo = null, ox = 0, oy = 0, panx = 0, pany = 0, pan = false;

world.addEventListener("pointerdown", (e) => {
  const nd = e.target.closest(".node"); if (!nd) return;
  const item = [...nodes.values()].find((n) => n.el === nd); if (!item) return;
  alvo = item; ox = e.clientX / esc - item.x; oy = e.clientY / esc - item.y;
  nd.classList.add("dragging"); nd.setPointerCapture(e.pointerId); e.stopPropagation();
});
world.addEventListener("pointermove", (e) => {
  if (!alvo) return;
  alvo.x = e.clientX / esc - ox; alvo.y = e.clientY / esc - oy;
  alvo.el.style.transform = `translate(${alvo.x}px, ${alvo.y}px)`;
  desenhar();
});
world.addEventListener("pointerup", () => { if (alvo){ alvo.el.classList.remove("dragging"); alvo = null; salvar(); } });

stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".node")) return;
  pan = true; panx = e.clientX - tx; pany = e.clientY - ty;
  stage.classList.add("panning"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => { if (pan){ tx = e.clientX - panx; ty = e.clientY - pany; camera(); } });
stage.addEventListener("pointerup", () => { if (pan){ pan = false; stage.classList.remove("panning"); salvar(); } });

function zoom(f){ esc = Math.min(2, Math.max(0.12, esc * f)); camera(); salvar(); }
document.getElementById("zin").onclick = () => zoom(1.18);
document.getElementById("zout").onclick = () => zoom(1/1.18);
document.getElementById("fit").onclick = () => {
  const w = svg.width.baseVal.value, h = svg.height.baseVal.value;
  esc = Math.min((innerWidth - 60) / w, (innerHeight - 130) / h, 1);
  tx = 24; ty = 70; camera(); salvar();
};
document.getElementById("reset").onclick = () => {
  localStorage.removeItem(KEY); tx = 0; ty = 60; esc = 1; camera(); layout();
};
const btnPend = document.getElementById("soPend");
btnPend.onclick = () => {
  soPendencias = !soPendencias;
  btnPend.setAttribute("aria-pressed", String(soPendencias));
  layout();
};
stage.addEventListener("wheel", (e) => { if (e.ctrlKey){ e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 1/1.1); } }, { passive:false });

layout();
if (carregar()) aplicar();
camera();
</script>
