<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>Entrar | SIPLAM — PPA 2028–2031</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="SIPLAM — sistema de elaboração do Plano Plurianual 2028–2031 do Estado de Goiás." />
        <meta name="keywords" content="SIPLAM, PPA, Plano Plurianual, Goiás, planejamento" />
        <meta name="author" content="Governo do Estado de Goiás" />

        <!-- App favicon -->
        <link rel="shortcut icon" href="inspinia/assets/images/favicon.ico" />
 <!-- Theme Config Js -->
<script src="inspinia/assets/js/config.js"></script>

<!-- Vendor css -->
<link href="inspinia/assets/css/vendors.min.css" rel="stylesheet" type="text/css" />

<!-- App css -->
<link id="app-style" href="inspinia/assets/css/app.min.css" rel="stylesheet" type="text/css" />

    </head>

    <body>
        <div class="auth-box p-0 w-100">
            <div class="row w-100 g-0">
                <div class="col">
                    <div class="h-100 position-relative card-side-img rounded-0 overflow-hidden" style="background-image: url(&quot;inspinia/assets/images/auth.jpg&quot;)">
                        <div class="p-4 card-img-overlay auth-overlay d-flex align-items-end justify-content-center"></div>
                    </div>
                </div>
                <div class="col-md-auto">
                    <!--Auth Box content -->
                    <div class="card auth-box-form border-0 mb-0">
                        <div class="card-body min-vh-100 d-flex flex-column justify-content-center">
                            <div class="auth-brand mb-0 text-center">
                                <a href="index.html" class="logo-dark">
                                    <img src="inspinia/assets/images/logo-black.png" alt="dark logo" />
                                </a>
                                <a href="index.html" class="logo-light">
                                    <img src="inspinia/assets/images/logo.png" alt="logo" />
                                </a>
                            </div>

                            <div class="mt-auto text-center">
                                <h4 class="fw-bold">SIPLAM — PPA 2028–2031</h4>
                                <p class="text-muted auth-sub-text mx-auto">Acesse com as credenciais do seu órgão para elaborar ou analisar as contribuições ao Plano Plurianual.</p>

                                <form class="mt-4">
                                    <div class="mb-3">
                                        <div class="input-group">
                                            <input type="text" class="form-control py-2 px-3 bg-light bg-opacity-40 border-light" id="userEmail" placeholder="CPF ou e-mail institucional" required />
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="input-group">
                                            <input type="password" class="form-control py-2 px-3 bg-light bg-opacity-40 border-light" id="userPassword" placeholder="Informe sua senha" required />
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div class="form-check">
                                            <input class="form-check-input form-check-input-light fs-14" type="checkbox" id="rememberMe" />
                                            <label class="form-check-label" for="rememberMe">Manter-me conectado</label>
                                        </div>

                                        <a href="inspinia/auth-split-reset-pass.html" class="text-decoration-underline link-offset-3 text-muted">Esqueci minha senha</a>
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary fw-bold py-2">Entrar</button>
                                    </div>
                                </form>
                            </div>

                            <p class="text-muted text-center mt-4 mb-0">
                                Protótipo de interface — a autenticação ainda não está implementada.
                            </p>

                            <p class="text-center text-muted mt-auto mb-0">
                                ©
                                <span data-current-year></span>
                                <span class="fw-bold">Estado de Goiás</span>
                            </p>
                        </div>
                    </div>
                    <!-- End Auth Box Content -->
                </div>
            </div>
        </div>

        <!-- Vendor js -->
        <script src="inspinia/assets/js/vendors.min.js"></script>

        <!-- App js -->
        <script src="inspinia/assets/js/app.js"></script>

    </body>
</html>
